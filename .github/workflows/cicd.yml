name: Income Model CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'data/**.dvc'
      - 'src/**.py'
      - 'params.yaml'
  workflow_dispatch:

jobs:

  # ---------------------------------------------------------------------------
  # JOB 1 - UNIT TEST
  # Chay unit tests tren du lieu ao (khong can ket noi cloud storage).
  # Neu co bat ky test nao that bai, pipeline dung lai o day va khong tien hanh
  # huan luyen hay trien khai.
  # ---------------------------------------------------------------------------
  unit-test:
    name: Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: pytest tests/ -v


  # ---------------------------------------------------------------------------
  # JOB 2 - TRAIN
  # Xac thuc cloud storage, pull du lieu bang DVC, huan luyen mo hinh, upload artifact.
  # Chi chay khi Job 1 (Unit Test) hoan thanh thanh cong.
  # ---------------------------------------------------------------------------
  train:
    name: Train
    needs: unit-test
    runs-on: ubuntu-latest
    outputs:
      f1: ${{ steps.read_report.outputs.f1 }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Authenticate to S3
        env:
          CREDS: ${{ secrets.STORAGE_CREDENTIALS }}
          ARTIFACT_BUCKET: ${{ secrets.ARTIFACT_BUCKET }}
        run: |
          python - <<'PYEOF'
          import csv, io, json, os, sys

          # Actions renders a populated secret as "***"; an empty value here means the
          # secret does not exist in the repo, not that the content is unparseable.
          raw = os.environ.get("CREDS", "").lstrip("﻿").strip()
          if not raw:
              sys.exit(
                  "ERROR: secret STORAGE_CREDENTIALS is not set (or is empty).\n"
                  "  Add it under Settings > Secrets and variables > Actions > New repository secret\n"
                  "    Name:  STORAGE_CREDENTIALS\n"
                  '    Value: {"aws_access_key_id": "AKIA...", "aws_secret_access_key": "..."}\n'
                  "           (or paste the whole accessKeys.csv from the IAM console verbatim)"
              )

          AK_KEYS = ("aws_access_key_id", "access key id", "accesskeyid")
          SK_KEYS = ("aws_secret_access_key", "secret access key", "secretaccesskey")

          def pick(mapping, wanted):
              for key, value in mapping.items():
                  if key and str(key).lstrip("﻿").strip().lower() in wanted and value:
                      return str(value).strip()
              return ""

          ak = sk = ""

          # Format 1 - JSON object.
          try:
              data = json.loads(raw)
          except ValueError:
              data = None
          if isinstance(data, dict):
              ak, sk = pick(data, AK_KEYS), pick(data, SK_KEYS)

          # Format 2 - accessKeys.csv as downloaded from the IAM console.
          if not (ak and sk):
              try:
                  rows = list(csv.DictReader(io.StringIO(raw)))
              except csv.Error:
                  rows = []
              if rows:
                  ak, sk = pick(rows[0], AK_KEYS), pick(rows[0], SK_KEYS)

          # Format 3 - key=value lines / ~/.aws/credentials style.
          if not (ak and sk):
              kv = {}
              for line in raw.splitlines():
                  if "=" in line and not line.strip().startswith(("[", "#")):
                      key, _, value = line.partition("=")
                      kv[key] = value
              ak, sk = pick(kv, AK_KEYS), pick(kv, SK_KEYS)

          if not (ak and sk):
              sys.exit(
                  "ERROR: STORAGE_CREDENTIALS is set but contains no access key pair.\n"
                  f"  Received {len(raw)} chars over {len(raw.splitlines())} line(s).\n"
                  "  Expected JSON, accessKeys.csv, or key=value lines."
              )

          bucket = os.environ.get("ARTIFACT_BUCKET", "").strip()
          bucket = bucket.removeprefix("s3://").strip("/")
          if not bucket:
              sys.exit(
                  "ERROR: secret ARTIFACT_BUCKET is not set (or is empty).\n"
                  "  Expected the bare bucket name, e.g. income-lab-nvha-2601692 (no s3:// prefix)."
              )

          # Values parsed out of a secret are NOT masked automatically - register them
          # so they cannot surface in the logs of any later step.
          print(f"::add-mask::{ak}")
          print(f"::add-mask::{sk}")

          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"AWS_ACCESS_KEY_ID={ak}\n")
              f.write(f"AWS_SECRET_ACCESS_KEY={sk}\n")
              f.write("AWS_DEFAULT_REGION=us-east-1\n")
              f.write(f"ARTIFACT_BUCKET={bucket}\n")

          if len(ak) != 20 or len(sk) != 40:
              print(
                  f"WARNING: unexpected key lengths (id={len(ak)}, secret={len(sk)}); "
                  "AWS keys are normally 20 and 40 chars - the paste may be truncated."
              )
          print(f"OK: credentials parsed, target bucket {bucket}")
          PYEOF

      - name: Pull data with DVC
        run: dvc pull data/train_batch1.csv.dvc data/holdout.csv.dvc

      - name: Train model
        run: python src/train.py

      - name: Read report
        id: read_report
        run: |
          F1=$(python -c "import json; d=json.load(open('outputs/report.json')); print(d['f1_score'])")
          echo "f1=$F1" >> $GITHUB_OUTPUT

      - name: Upload model to Cloud Storage
        run: |
          python - <<'PYEOF'
          import os, boto3
          # ARTIFACT_BUCKET comes from the auth step already normalised (no s3:// prefix).
          boto3.client("s3").upload_file(
              "models/model.joblib", os.environ["ARTIFACT_BUCKET"],
              "artifacts/current/model.joblib")
          print("Uploaded model.joblib to S3")
          PYEOF

      - name: Save report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: report
          path: outputs/


  # ---------------------------------------------------------------------------
  # JOB 3 - QUALITY GATE
  # Kiem tra nguong chat luong (f1_score >= 0.65).
  # Pipeline dung lai o day neu mo hinh chua dat yeu cau.
  #
  # Luu y: nguong o day dat tren f1_score chu KHONG phai accuracy. Bo du lieu
  # Adult co ty le lop 75/25, nen mot mo hinh doan bua "thu nhap thap" cho moi
  # mau da dat accuracy 0.75 ma hoan toan vo dung.
  # Chi chay khi Job 2 (Train) hoan thanh thanh cong.
  # ---------------------------------------------------------------------------
  quality-gate:
    name: Quality Gate
    needs: train
    runs-on: ubuntu-latest
    steps:

      - name: Check quality gate
        run: |
          python - <<'PYEOF'
          f1 = float("${{ needs.train.outputs.f1 }}")
          if f1 < 0.65:
              raise SystemExit(f"FAILED: f1_score {f1:.4f} < 0.65. Huy trien khai.")
          print("PASSED: dang trien khai model.")
          PYEOF


  # ---------------------------------------------------------------------------
  # JOB 4 - RELEASE
  # Trien khai len VM qua SSH.
  # Chi chay khi Job 3 (Quality Gate) hoan thanh thanh cong.
  # ---------------------------------------------------------------------------
  release:
    name: Release
    needs: quality-gate
    runs-on: ubuntu-latest
    steps:

      - name: SSH deploy to VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            sudo systemctl restart income-api
            for i in $(seq 1 10); do
              sleep 3
              if curl -sf http://localhost:8080/healthz; then echo "Health check passed."; exit 0; fi
              echo "waiting... ($i/10)"
            done
            echo "Health check FAILED"; exit 1
